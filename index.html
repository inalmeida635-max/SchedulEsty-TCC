<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchedulEsty</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================
   RESET & TOKENS
===================================================== */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
:root{
  --rosa:#d875a0;
  --rosa-escuro:#c65a8a;
  --rosa-claro:#fff0f6;
  --fundo:#fff9fb;
  --roxo:#8b6fd9;
  --roxo-escuro:#6f56c2;
  --gradiente:linear-gradient(135deg,#8b6fd9 0%,#d875a0 100%);
  --texto:#292929;
  --texto-suave:#6b6b6b;
  --borda:#f0dce5;
  --branco:#ffffff;
  --sucesso:#4caf7d;
  --sucesso-fundo:#e8f7f0;
  --alerta:#c98a1f;
  --alerta-fundo:#fdf3e2;
  --erro:#d3455c;
  --erro-fundo:#fdeaee;
  --sombra:0 5px 20px rgba(0,0,0,.06);
  --sombra-forte:0 10px 30px rgba(139,111,217,.18);
  --raio:14px;
  --raio-sm:10px;
}
html,body{background:var(--fundo);color:var(--texto);min-height:100vh;}
a{color:inherit;}
button{font:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font:inherit;border:1px solid var(--borda);border-radius:var(--raio-sm);padding:11px 14px;background:var(--branco);color:var(--texto);width:100%;outline:none;transition:.2s;}
input:focus,select:focus,textarea:focus{border-color:var(--rosa);box-shadow:0 0 0 3px rgba(216,117,160,.12);}
label{display:block;font-size:13px;font-weight:600;color:var(--texto-suave);margin-bottom:6px;}
.campo{margin-bottom:16px;}
h1,h2,h3,h4{font-weight:700;color:var(--texto);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#e6c3d3;border-radius:8px;}

/* =====================================================
   BOTÕES
===================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:600;font-size:14px;transition:.2s ease;white-space:nowrap;}
.btn-primario{background:var(--gradiente);color:#fff;box-shadow:var(--sombra-forte);}
.btn-primario:hover{transform:translateY(-2px);filter:brightness(1.05);}
.btn-secundario{background:#fff;color:var(--rosa);border:1px solid var(--borda);}
.btn-secundario:hover{background:var(--rosa-claro);}
.btn-perigo{background:var(--erro-fundo);color:var(--erro);}
.btn-perigo:hover{background:#f9d3da;}
.btn-texto{color:var(--rosa);font-weight:600;}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px;}
.btn-bloco{width:100%;}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none !important;}
.icone-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--borda);font-size:16px;position:relative;flex-shrink:0;}
.icone-btn:hover{background:var(--rosa-claro);}
.badge-ponto{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--erro);}

/* =====================================================
   TELAS DE AUTENTICAÇÃO
===================================================== */
.tela-auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:radial-gradient(circle at 15% 15%,#f4e9fb 0%,var(--fundo) 45%);}
.cartao-auth{background:#fff;border-radius:22px;box-shadow:var(--sombra-forte);padding:44px;width:100%;max-width:420px;}
.cartao-auth .marca{text-align:center;margin-bottom:26px;}
.marca-titulo{font-size:26px;font-weight:800;background:var(--gradiente);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px;}
.marca-sub{font-size:13px;color:var(--texto-suave);margin-top:4px;}
.cartao-auth h2{font-size:20px;margin-bottom:6px;}
.cartao-auth p.legenda{font-size:13px;color:var(--texto-suave);margin-bottom:24px;}
.link-central{text-align:center;margin-top:18px;font-size:13.5px;color:var(--texto-suave);}
.opcoes-tipo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;}
.cartao-tipo{border:1.5px solid var(--borda);border-radius:16px;padding:26px 16px;text-align:center;transition:.2s;background:#fff;}
.cartao-tipo:hover{border-color:var(--rosa);transform:translateY(-3px);box-shadow:var(--sombra);}
.cartao-tipo .emoji{font-size:34px;display:block;margin-bottom:10px;}
.cartao-tipo h3{font-size:15px;margin-bottom:4px;}
.cartao-tipo p{font-size:12px;color:var(--texto-suave);}
.erro-form{background:var(--erro-fundo);color:var(--erro);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;}
.sucesso-form{background:var(--sucesso-fundo);color:var(--sucesso);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;}

/* =====================================================
   LAYOUT CLIENTE (header horizontal, como o site original)
===================================================== */
.layout-cliente{min-height:100vh;display:flex;flex-direction:column;}
.header-cliente{height:80px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6%;box-shadow:0 3px 15px rgba(190,120,150,.06);position:sticky;top:0;z-index:50;}
.header-cliente nav{display:flex;align-items:center;gap:26px;}
.header-cliente nav a{text-decoration:none;color:var(--texto-suave);font-size:14px;font-weight:500;padding:8px 2px;border-bottom:2px solid transparent;transition:.2s;}
.header-cliente nav a:hover,.header-cliente nav a.ativo{color:var(--rosa);border-color:var(--rosa);}
.header-direita{display:flex;align-items:center;gap:12px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--gradiente);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;object-fit:cover;flex-shrink:0;}
.conteudo-cliente{flex:1;padding:34px 6% 60px;max-width:1200px;margin:0 auto;width:100%;}
.menu-mobile-toggle{display:none;}

/* =====================================================
   LAYOUT ADMIN (sidebar + topbar, como as imagens de referência)
===================================================== */
.layout-admin{min-height:100vh;display:flex;}
.sidebar-admin{width:250px;background:#fff;border-right:1px solid var(--borda);padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;transition:.25s;}
.sidebar-admin .marca-titulo{padding:0 8px 22px;display:block;}
.nav-admin{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.nav-admin a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--texto-suave);font-size:14px;font-weight:500;}
.nav-admin a .emoji-nav{font-size:16px;width:20px;text-align:center;}
.nav-admin a:hover{background:var(--rosa-claro);color:var(--rosa-escuro);}
.nav-admin a.ativo{background:var(--gradiente);color:#fff;box-shadow:var(--sombra-forte);}
.nav-admin .grupo-titulo{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#b9b9b9;margin:14px 10px 4px;font-weight:700;}
.rodape-sidebar{border-top:1px solid var(--borda);padding-top:14px;margin-top:10px;}
.rodape-sidebar button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--texto-suave);font-size:14px;}
.rodape-sidebar button:hover{background:var(--erro-fundo);color:var(--erro);}
.area-principal{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar-admin{height:78px;background:#fff;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:40;gap:20px;}
.busca-topbar{flex:1;max-width:380px;position:relative;}
.busca-topbar input{padding-left:38px;background:var(--fundo);border:1px solid var(--borda);}
.busca-topbar span{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;}
.topbar-acoes{display:flex;align-items:center;gap:14px;}
.perfil-topbar{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:30px;border:1px solid var(--borda);}
.perfil-topbar span{font-size:13px;font-weight:600;}
.conteudo-admin{padding:30px;flex:1;}
.cabecalho-pagina{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.cabecalho-pagina .trilha{font-size:12.5px;color:var(--texto-suave);margin-bottom:6px;}
.cabecalho-pagina .trilha a{color:var(--roxo);text-decoration:none;}
.cabecalho-pagina h1{font-size:23px;}
.hamburguer{display:none;}

/* =====================================================
   CARDS, GRIDS E COMPONENTES GERAIS
===================================================== */
.grade-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
.grade-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.cartao{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:20px;box-shadow:var(--sombra);}
.cartao h3{font-size:15px;margin-bottom:4px;}
.cartao-servico{background:#fff;border:1px solid var(--borda);border-radius:18px;overflow:hidden;box-shadow:var(--sombra);display:flex;flex-direction:column;transition:.2s;}
.cartao-servico:hover{transform:translateY(-4px);box-shadow:var(--sombra-forte);}
.capa-servico{height:110px;background:var(--gradiente);display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;}
.corpo-servico{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1;}
.corpo-servico h3{font-size:16px;}
.corpo-servico .prof{font-size:12.5px;color:var(--texto-suave);}
.corpo-servico .desc{font-size:13px;color:var(--texto-suave);line-height:1.5;flex:1;}
.linha-preco{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
.preco{font-size:17px;font-weight:700;color:var(--rosa-escuro);}
.duracao-pill{font-size:11.5px;background:var(--rosa-claro);color:var(--rosa-escuro);padding:4px 10px;border-radius:20px;font-weight:600;}

.stat-cartao{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;box-shadow:var(--sombra);}
.stat-icone{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.stat-valor{font-size:24px;font-weight:800;}
.stat-label{font-size:12.5px;color:var(--texto-suave);}

.tabela-simples{width:100%;border-collapse:collapse;}
.tabela-simples th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-suave);padding:10px 14px;border-bottom:1px solid var(--borda);}
.tabela-simples td{padding:14px;border-bottom:1px solid #f5eaf0;font-size:13.5px;vertical-align:middle;}
.tabela-simples tr:last-child td{border-bottom:none;}
.pessoa-cel{display:flex;align-items:center;gap:10px;}

.selo{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.selo-pendente{background:var(--alerta-fundo);color:var(--alerta);}
.selo-confirmado{background:#e6effa;color:#2f6fb0;}
.selo-concluido{background:var(--sucesso-fundo);color:var(--sucesso);}
.selo-cancelado{background:var(--erro-fundo);color:var(--erro);}
.selo-ativa{background:var(--sucesso-fundo);color:var(--sucesso);}
.selo-agendada{background:var(--alerta-fundo);color:var(--alerta);}
.selo-encerrada{background:#eee;color:#777;}

.vazio{text-align:center;padding:60px 20px;color:var(--texto-suave);}
.vazio .emoji-vazio{font-size:40px;display:block;margin-bottom:14px;}
.vazio h3{color:var(--texto);margin-bottom:6px;font-size:16px;}
.vazio p{font-size:13.5px;max-width:340px;margin:0 auto;}

.abas{display:flex;gap:6px;border-bottom:1px solid var(--borda);margin-bottom:22px;}
.abas button{padding:11px 18px;font-size:13.5px;font-weight:600;color:var(--texto-suave);border-bottom:2px solid transparent;margin-bottom:-1px;}
.abas button.ativa{color:var(--rosa-escuro);border-color:var(--rosa);}

.estrelas{color:#f0b429;letter-spacing:2px;}
.chip{display:inline-block;padding:4px 11px;border-radius:20px;background:var(--rosa-claro);color:var(--rosa-escuro);font-size:12px;font-weight:600;}

/* =====================================================
   MENSAGENS (chat)
===================================================== */
.tela-mensagens{display:grid;grid-template-columns:320px 1fr;gap:0;background:#fff;border:1px solid var(--borda);border-radius:18px;overflow:hidden;box-shadow:var(--sombra);height:calc(100vh - 220px);min-height:480px;}
.lista-conversas{border-right:1px solid var(--borda);overflow-y:auto;display:flex;flex-direction:column;}
.busca-conversas{padding:16px;border-bottom:1px solid var(--borda);}
.item-conversa{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #f7ebf1;cursor:pointer;transition:.15s;}
.item-conversa:hover,.item-conversa.ativa{background:var(--rosa-claro);}
.item-conversa .info{flex:1;min-width:0;}
.item-conversa .linha1{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;}
.item-conversa .prev{font-size:12.5px;color:var(--texto-suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-conversa .hora{font-size:11px;color:#b7b7b7;}
.pill-nao-lida{background:var(--gradiente);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 7px;}
.painel-chat{display:flex;flex-direction:column;min-width:0;}
.chat-cabecalho{padding:16px 22px;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:12px;}
.chat-corpo{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:10px;background:#fffcfd;}
.bolha{max-width:65%;padding:10px 15px;border-radius:16px;font-size:13.5px;line-height:1.4;}
.bolha-recebida{align-self:flex-start;background:#f1eef8;color:var(--texto);border-bottom-left-radius:4px;}
.bolha-enviada{align-self:flex-end;background:var(--gradiente);color:#fff;border-bottom-right-radius:4px;}
.chat-rodape{padding:16px 20px;border-top:1px solid var(--borda);display:flex;gap:12px;}
.chat-rodape input{border-radius:24px;}
.sem-chat{flex:1;display:flex;align-items:center;justify-content:center;color:var(--texto-suave);flex-direction:column;gap:10px;}

/* =====================================================
   FIDELIDADE
===================================================== */
.nivel-linha{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:14px;margin-bottom:10px;border:1px solid var(--borda);}
.nivel-linha.destaque{background:linear-gradient(135deg,#efe9fc,#fdeaf2);border-color:#e6cfe6;}
.nivel-emoji{font-size:20px;margin-right:12px;}
.progresso-fundo{background:#f1e3ea;border-radius:20px;height:10px;overflow:hidden;margin:10px 0;}
.progresso-barra{height:100%;background:var(--gradiente);border-radius:20px;transition:.4s;}
.ranking-linha{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid #f5eaf0;}
.ranking-num{width:26px;height:26px;border-radius:50%;background:var(--rosa-claro);color:var(--rosa-escuro);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}

/* =====================================================
   MODAL
===================================================== */
.overlay-modal{position:fixed;inset:0;background:rgba(30,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.caixa-modal{background:#fff;border-radius:20px;padding:30px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.caixa-modal h2{font-size:19px;margin-bottom:18px;}
.linha-modal-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.linha-modal-topo h2{margin:0;}
.linha-botoes{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;}

/* =====================================================
   TOAST
===================================================== */
#toast-container{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:10px;}
.toast{background:#fff;border-left:4px solid var(--rosa);box-shadow:var(--sombra-forte);padding:14px 20px;border-radius:12px;font-size:13.5px;min-width:240px;animation:entra .25s ease;}
.toast.erro{border-color:var(--erro);}
.toast.sucesso{border-color:var(--sucesso);}
@keyframes entra{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* =====================================================
   TELA DE CARREGAMENTO
===================================================== */
.tela-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--texto-suave);}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid var(--rosa-claro);border-top-color:var(--rosa);animation:girar .7s linear infinite;}
@keyframes girar{to{transform:rotate(360deg);}}

/* =====================================================
   RESPONSIVO
===================================================== */
@media(max-width:900px){
  .sidebar-admin{position:fixed;left:-260px;z-index:150;box-shadow:0 0 40px rgba(0,0,0,.15);}
  .sidebar-admin.aberta{left:0;}
  .hamburguer{display:flex;}
  .grade-2{grid-template-columns:1fr;}
  .tela-mensagens{grid-template-columns:1fr;height:calc(100vh - 180px);}
  .lista-conversas{display:none;}
  .lista-conversas.mostrar{display:flex;}
  .painel-chat.mostrar{display:none;}
  .header-cliente nav{display:none;}
  .opcoes-tipo{grid-template-columns:1fr;}
}
</style>
</head>

<div id="toast-container"></div>
<div id="modal-root"></div>
<div id="app"><div class="tela-loading"><div class="spinner"></div><p>Carregando o SchedulEsty...</p></div></div>

<script type="module">
/* =====================================================================
   SCHEDULESTY — aplicação única (SPA) sobre Firebase
   Auth + Firestore + Storage. Tudo roda neste único arquivo index.html.
===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, sendPasswordResetEmail, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
  getDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp,
  Timestamp, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* =====================================================================
   1) CONFIGURAÇÃO DO FIREBASE
   -----------------------------------------------------------------
   Troque os valores abaixo pelos do SEU projeto:
   Console do Firebase > Configurações do projeto > Geral >
   "Seus apps" > app Web > SDK do Firebase (Config).
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBCS4dZjk64Klwsj5mwMgc2MIJ_RZQ1Ogs",
  authDomain: "schedulesty-1328e.firebaseapp.com",
  projectId: "schedulesty-1328e",
  storageBucket: "schedulesty-1328e.firebasestorage.app",
  messagingSenderId: "1068046153206",
  appId: "1:1068046153206:web:3745881a9bbde937cec3d7"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const storage = getStorage(firebaseApp); setPersistence(auth, browserLocalPersistence).catch((err) => { console.warn('[Firebase] Nao foi possivel definir a persistencia de sessao:', err.message); }); console.log('[Firebase] SchedulEsty conectado - projeto:', firebaseConfig.projectId);

/* =====================================================================
   2) ESTADO GLOBAL
===================================================================== */
const estado = {
  user: null,          // usuário do Firebase Auth
  perfil: null,         // documento usuarios/{uid}
  categorias: [],        // cache simples de categorias
  assinaturas: [],        // unsubscribes (onSnapshot) da rota atual
  agendarSelecao: null,    // horário escolhido no fluxo de agendar
  sidebarAberta: false,
};

function limparAssinaturas(){
  estado.assinaturas.forEach(fn => { try{ fn(); }catch(e){} });
  estado.assinaturas = [];
}

/* =====================================================================
   3) HELPERS GERAIS
===================================================================== */
const appEl = () => document.getElementById('app');
const $  = (sel, ctx=document) => ctx.querySelector(sel);
const $$ = (sel, ctx=document) => [...ctx.querySelectorAll(sel)];

function esc(v){
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function iniciais(nome){
  if(!nome) return '?';
  const p = nome.trim().split(/\s+/);
  return ((p[0]?.[0]||'') + (p[1]?.[0]||'')).toUpperCase();
}
function formatBRL(v){
  return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function formatDataBR(iso){
  if(!iso) return '—';
  const [a,m,d] = iso.split('-');
  return `${d}/${m}/${a}`;
}
function formatDataHoraBR(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function horaCurta(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
const DIAS_SEMANA = ['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
const DIAS_SEMANA_LABEL = {domingo:'Domingo',segunda:'Segunda-feira',terca:'Terça-feira',quarta:'Quarta-feira',quinta:'Quinta-feira',sexta:'Sexta-feira',sabado:'Sábado'};
function diaSemanaDe(dataISO){
  const [a,m,d] = dataISO.split('-').map(Number);
  return DIAS_SEMANA[new Date(a, m-1, d).getDay()];
}
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function minParaHora(min){
  const h = Math.floor(min/60).toString().padStart(2,'0');
  const m = (min%60).toString().padStart(2,'0');
  return `${h}:${m}`;
}
function horaParaMin(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function nivelAtual(pontos, niveis){
  return niveis.find(n => pontos >= n.pontosMin && pontos <= n.pontosMax) || niveis[niveis.length-1];
}


function redimensionarImagemParaBase64(arquivo, maxLado = 300, qualidade = 0.7){
  return new Promise((resolve, reject)=>{
    const leitor = new FileReader();
    leitor.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
    leitor.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Arquivo não é uma imagem válida.'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxLado){ height = Math.round(height * maxLado / width); width = maxLado; }
        else if (height > maxLado){ width = Math.round(width * maxLado / height); height = maxLado; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

const col = (nome) => collection(db, nome);
const refDoc = (nome, id) => doc(db, nome, id);

async function buscarDoc(nome, id){
  let s; try{ s = await getDoc(refDoc(nome,id)); }catch(err){ console.warn('[Firestore] Falha ao buscar', nome, id, ':', err.code||err.message); return null; }
  return s.exists() ? { id:s.id, ...s.data() } : null;
}
async function listarOnde(nome, campo, valor){
  const q = query(col(nome), where(campo,'==',valor));
  const s = await getDocs(q);
  return s.docs.map(d=>({id:d.id, ...d.data()}));
}
async function listarTudo(nome){
  const s = await getDocs(col(nome));
  return s.docs.map(d=>({id:d.id, ...d.data()}));
}
const cacheUsuarios = new Map();
async function buscarUsuarioCache(uid){
  if(!uid) return null;
  if(cacheUsuarios.has(uid)) return cacheUsuarios.get(uid);
  const u = await buscarDoc('usuarios', uid);
  cacheUsuarios.set(uid, u);
  return u;
}

window.addEventListener('hashchange', aplicarRota);

function aplicarRota(){
  fecharModal();
  limparAssinaturas();
  const hash = location.hash.replace(/^#/, '') || '/';

  if (!estado.user){
    if (hash === '/entrar-cliente') return renderLogin('cliente');
    if (hash === '/entrar-admin') return renderLogin('admin');
    if (hash === '/recuperar-senha') return renderRecuperarSenha();
    if (hash.startsWith('/cadastro/cliente')) return renderCadastro('cliente');
    if (hash.startsWith('/cadastro/admin')) return renderCadastro('admin');
    return renderEscolha();
  }

  // já autenticado
  if (['/', '', '/entrar-cliente','/entrar-admin','/recuperar-senha'].includes(hash) || hash.startsWith('/cadastro')) {
    location.hash = estado.perfil?.tipo === 'admin' ? '#/a/inicio' : '#/c/inicio';
    return;
  }

  if (estado.perfil?.tipo === 'cliente'){
    if (!hash.startsWith('/c/')) { location.hash = '#/c/inicio'; return; }
    return renderCliente(hash);
  } else {
    if (!hash.startsWith('/a/')) { location.hash = '#/a/inicio'; return; }
    return renderAdmin(hash);
  }
}

onAuthStateChanged(auth, async (user) => {
  estado.user = user;
  if (user){
    estado.perfil = await buscarDoc('usuarios', user.uid);
    if (!estado.perfil){
      // conta órfã (sem doc) — desloga por segurança
      await signOut(auth);
      estado.user = null; estado.perfil = null;
    }
  } else {
    estado.perfil = null;
  }
  aplicarRota();
});

async function fazerCadastro({ tipo, nome, email, senha, telefone, especialidade }){
  const cred = await createUserWithEmailAndPassword(auth, email, senha);
  const uid = cred.user.uid;
  const dadosBase = {
    nome, email, tipo,
    foto: null,
    dataCadastro: serverTimestamp(),
  };
  if (tipo === 'cliente'){
    Object.assign(dadosBase, { telefone: telefone||null, dataNascimento:null, cpf:null, pontosFidelidade:0 });

    Object.assign(dadosBase, { especialidade: especialidade||'Não informada', telefone: telefone||null, ativo:true });

      pontosPorReal: 1,

        { nome:'Bronze', pontosMin:0, pontosMax:299, beneficio:'5% de desconto' },

/* liga a busca simples do topbar/paginas: filtra elementos [data-buscavel] */
function ligarBuscaSimples(seletorInput){
  const input = $(seletorInput);
  if(!input) return;
  input.addEventListener('input', ()=>{
    const termo = input.value.trim().toLowerCase();
    $$('[data-buscavel]').forEach(elItem=>{
      const alvo = elItem.dataset.buscavel.toLowerCase();
      elItem.style.display = alvo.includes(termo) ? '' : 'none';
    });
  });
}

async function viewClienteAgendar(servicoId){
  appEl().innerHTML = layoutCliente(`<div class="vazio"><div class="spinner" style="margin:0 auto;"></div></div>`, '/c/agendar');
  const servico = await buscarDoc('servicos', servicoId);
  if (!servico){ appEl().innerHTML = layoutCliente(`<div class="vazio"><h3>Serviço não encontrado</h3><a href="#/c/inicio" class="btn btn-primario" style="margin-top:12px;">Voltar</a></div>`, '/c/inicio'); return; }
  const prof = await buscarUsuarioCache(servico.idProfissional);
  estado.agendarSelecao = null;

  async function montarSlots(dataEscolhida){
    const dia = diaSemanaDe(dataEscolhida);
    const disponibilidades = await listarOnde('disponibilidade','idProfissional', servico.idProfissional);
    const doDia = disponibilidades.filter(d => d.diaSemana === dia && d.ativo);
    if (doDia.length === 0) return { slots: [], semAtendimento: true };

    const todosAgendamentos = await listarOnde('agendamentos','idProfissional', servico.idProfissional);
    const ocupados = new Set(todosAgendamentos.filter(a => a.data === dataEscolhida && a.status !== 'Cancelado').map(a => a.horario));

    const duracao = Number(servico.duracao) || 30;
    let slots = [];
    doDia.forEach(bloco=>{
      const ini = horaParaMin(bloco.horarioInicio), fim = horaParaMin(bloco.horarioFim);
      for (let m = ini; m + duracao <= fim; m += duracao){
        const hhmm = minParaHora(m);
        if (!ocupados.has(hhmm)) slots.push(hhmm);
      }
    });
    return { slots, semAtendimento: false };
  }

async function viewMensagens(papel, outroUidParam){

  appEl().innerHTML = layout(`<div class="vazio"><div class="spinner" style="margin:0 auto;"></div></div>`, rotaBase);

  let conversaAtualId = null;
  if (outroUidParam) conversaAtualId = await garantirConversa(meuUid, outroUidParam, papel);

  appEl().innerHTML = layout(`
    ${cabecalhoPagina('Comunicação', 'Mensagens')}
    <div class="tela-mensagens">
      <div class="lista-conversas ${conversaAtualId?'':'mostrar'}" id="lista-conversas">

    </div>
  `, rotaBase);

  const q = query(col('conversas'), where('participantes','array-contains', meuUid));
  const unsub = onSnapshot(q, (snap)=>{
    const lista = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(b.ultimaMensagemEm?.toMillis?.()||0) - (a.ultimaMensagemEm?.toMillis?.()||0));
    const itens = $('#itens-conversas');
    if (!itens) return;
    itens.innerHTML = lista.length ? lista.map(c=>{
      const souCliente = c.idCliente === meuUid;
      const nomeOutro = souCliente ? c.nomeProfissional : c.nomeCliente;
      const fotoOutro = souCliente ? c.fotoProfissional : c.fotoCliente;
      const outroUid = souCliente ? c.idProfissional : c.idCliente;
      const naoLido = !!c.naoLidoPara?.[meuUid];
      return `<div class="item-conversa ${c.id===conversaAtualId?'ativa':''}" data-action="abrir-chat" data-conversa="${c.id}" data-outro="${outroUid}" data-buscavel="${esc(nomeOutro)}">
        ${fotoOutro?`<img src="${esc(fotoOutro)}" class="avatar">`:`<div class="avatar">${iniciais(nomeOutro)}</div>`}
        <div class="info">
          <div class="linha1"><span>${esc(nomeOutro||'—')}</span><span class="hora">${c.ultimaMensagemEm?horaCurta(c.ultimaMensagemEm):''}</span></div>
          <div class="prev">${esc(c.ultimaMensagem || 'Nova conversa')}</div>
        </div>
        ${naoLido?'<span class="pill-nao-lida">novo</span>':''}
      </div>`;
    }).join('') : `<div class="vazio" style="padding:30px 16px;"><p>Nenhuma conversa ainda.</p></div>`;
    ligarBuscaSimples('#busca-conversas');
  });
  estado.assinaturas.push(unsub);

  estado.abrirChatFn = (conversaId, outroUid) => abrirChat(conversaId, outroUid, papel);
  if (conversaAtualId) abrirChat(conversaAtualId, outroUidParam, papel);
}

async function garantirConversa(meuUid, outroUid, papel){
  const clienteUid = papel === 'cliente' ? meuUid : outroUid;
  const profissionalUid = papel === 'cliente' ? outroUid : meuUid;
  const id = [clienteUid, profissionalUid].sort().join('_');
  const existente = await getDoc(refDoc('conversas', id));
  if (existente.exists()) return id;
  const [cli, prof] = await Promise.all([buscarUsuarioCache(clienteUid), buscarUsuarioCache(profissionalUid)]);
  await setDoc(refDoc('conversas', id), {
    participantes: [clienteUid, profissionalUid],
    idCliente: clienteUid, idProfissional: profissionalUid,
    nomeCliente: cli?.nome || 'Cliente', nomeProfissional: prof?.nome || 'Profissional',
    fotoCliente: cli?.foto || null, fotoProfissional: prof?.foto || null,
    ultimaMensagem: '', ultimaMensagemEm: serverTimestamp(),
    naoLidoPara: {},
  });
  return id;
}

async function abrirChat(conversaId, outroUid, papel){
  const meuUid = estado.user.uid;
  const outro = await buscarUsuarioCache(outroUid);
  const painel = $('#painel-chat');
  if (!painel) return;
  painel.classList.add('mostrar');
  $('#lista-conversas')?.classList.remove('mostrar');
  painel.innerHTML = `
    <div class="chat-cabecalho">
      <button class="icone-btn" id="btn-voltar-conversas" style="display:none;">←</button>
      ${outro?.foto?`<img src="${esc(outro.foto)}" class="avatar">`:`<div class="avatar">${iniciais(outro?.nome)}</div>`}
      <div><b>${esc(outro?.nome||'—')}</b></div>
    </div>
    <div class="chat-corpo" id="chat-corpo"></div>
    <form class="chat-rodape" data-form="enviar-mensagem" data-conversa="${conversaId}" data-outro="${outroUid}">
      <input name="texto" placeholder="Escreva uma mensagem..." autocomplete="off" required>
      <button class="btn btn-primario" type="submit">Enviar</button>
    </form>`;

  updateDoc(refDoc('conversas', conversaId), { [`naoLidoPara.${meuUid}`]: false }).catch(()=>{});

  const qMsgs = query(collection(db, 'conversas', conversaId, 'mensagens'), orderBy('criadoEm','asc'));
  const unsub = onSnapshot(qMsgs, (snap)=>{
    const corpo = $('#chat-corpo'); if (!corpo) return;
    corpo.innerHTML = snap.docs.map(d=>{
      const m = d.data();
      return `<div class="bolha ${m.remetente===meuUid?'bolha-enviada':'bolha-recebida'}">${esc(m.texto)}</div>`;
    }).join('') || `<p style="text-align:center;color:var(--texto-suave);font-size:13px;margin-top:20px;">Diga oi 👋</p>`;
    corpo.scrollTop = corpo.scrollHeight;
  });
  estado.assinaturas.push(unsub);
}

async function viewClienteFidelidade(){

  const idsProf = [...new Set(meusAgendamentos.map(a=>a.idProfissional))];
  const pontos = estado.perfil.pontosFidelidade || 0;

  const cartoesProf = await Promise.all(idsProf.map(async uid=>{
    const [prof, config] = await Promise.all([buscarUsuarioCache(uid), buscarDoc('fidelidadeConfig', uid)]);
    if (!config) return '';
    const niveis = config.niveis;
    const nivel = nivelAtual(pontos, niveis);
    const idx = niveis.findIndex(n=>n.nome===nivel.nome);
    const prox = niveis[idx+1];
    const progresso = prox ? Math.max(0, Math.min(100, Math.round(((pontos-nivel.pontosMin)/(prox.pontosMin-nivel.pontosMin))*100))) : 100;
    return `<div class="cartao">
      <h3>${esc(prof?.nome||'Profissional')}</h3>
      <p style="font-size:13px;color:var(--texto-suave);margin-bottom:12px;">Programa de fidelidade</p>

      ${prox ? `<div class="progresso-fundo"><div class="progresso-barra" style="width:${progresso}%;"></div></div><p style="font-size:12px;color:var(--texto-suave);">${pontos} / ${prox.pontosMin} pontos para virar ${esc(prox.nome)}</p>` : `<p style="font-size:12px;color:var(--texto-suave);margin-top:8px;">Você atingiu o nível máximo! 🎉</p>`}

  appEl().innerHTML = layoutCliente(`

    </div>
    <div class="grade-2">${cartoesFiltrados.join('') || `<div class="vazio" style="grid-column:1/-1;"><span class="emoji-vazio">🎁</span><h3>Ainda sem programa de fidelidade</h3><p>Assim que você agendar com um profissional, o programa de fidelidade dele aparece aqui.</p></div>`}</div>
  `, '/c/fidelidade');
}

  'escolher-horario': (ds)=>{ estado.agendarSelecao = ds.hora; const data = $('#input-data-agendar')?.value || hojeISO(); estado.redesenharAgendar?.(data); },
  'confirmar-agendamento-novo': async (ds)=>{
    if (!estado.agendarSelecao){ toast('Escolha um horário disponível.', 'erro'); return; }
    const data = $('#input-data-agendar').value;
    const servico = await buscarDoc('servicos', ds.servico);
    const obs = $('#obs-agendar')?.value.trim() || null;
    await addDoc(col('agendamentos'), {
      idCliente: estado.user.uid, idProfissional: servico.idProfissional, idServico: servico.id,
      data, horario: estado.agendarSelecao, status: 'Pendente', observacoes: obs, dataCriacao: serverTimestamp(),
    });
    toast('Agendamento solicitado! Aguarde a confirmação.', 'sucesso');
    estado.agendarSelecao = null;
    location.hash = '#/c/agendamentos';
  },
  'cliente-cancelar-agendamento': async (ds)=>{
    const ok = await confirmarAcao('Cancelar este agendamento?');
    if (!ok) return;
    await updateDoc(refDoc('agendamentos', ds.id), { status: 'Cancelado' });
    toast('Agendamento cancelado.', 'sucesso');
    viewClienteAgendamentos();
  },
  'abrir-feedback': (ds)=>{
    let nota = 5;
    const estrelasHtml = ()=> Array.from({length:5},(_,i)=>`<span data-estrela="${i+1}" style="cursor:pointer;font-size:28px;">${i<nota?'★':'☆'}</span>`).join('');
    const ligarEstrelas = ()=> $$('#estrelas-feedback span').forEach(s=>{ s.onclick = ()=>{ nota = Number(s.dataset.estrela); $('#estrelas-feedback').innerHTML = estrelasHtml(); ligarEstrelas(); }; });
    abrirModal(`
      <h2>Avaliar atendimento</h2>
      <div id="estrelas-feedback" style="margin-bottom:16px;">${estrelasHtml()}</div>
      <div class="campo"><label>Comentário (opcional)</label><textarea id="comentario-feedback" rows="3" placeholder="Como foi sua experiência?"></textarea></div>
      <div class="linha-botoes"><button class="btn btn-secundario" id="btn-cancelar-fb">Cancelar</button><button class="btn btn-primario" id="btn-enviar-fb">Enviar avaliação</button></div>
    `);
    ligarEstrelas();
    $('#btn-cancelar-fb').onclick = fecharModal;
    $('#btn-enviar-fb').onclick = async ()=>{
      await addDoc(col('feedbacks'), { idAgendamento: ds.id, idCliente: estado.user.uid, idProfissional: ds.profissional, nota, comentario: $('#comentario-feedback').value.trim()||null, dataCriacao: serverTimestamp() });
      fecharModal(); toast('Obrigado pela avaliação!', 'sucesso'); viewClienteHistorico();
    };
  },

  'abrir-chat': (ds)=>{ estado.abrirChatFn?.(ds.conversa, ds.outro); },

  'filtrar-agendamentos': (ds)=> viewAdminAgendamentos(ds.filtro),
  'mudar-status-agendamento': async (ds)=>{
    await updateDoc(refDoc('agendamentos', ds.id), { status: ds.status });
    toast(ds.status==='Cancelado' ? 'Agendamento cancelado.' : 'Agendamento confirmado!', ds.status==='Cancelado'?'erro':'sucesso');
    viewAdminAgendamentos();
  },
  'concluir-agendamento': async (ds)=>{
    const ok = await confirmarAcao('Marcar este agendamento como concluído? Isso libera os pontos de fidelidade para o cliente.');
    if (!ok) return;
    const ag = await buscarDoc('agendamentos', ds.id);
    await updateDoc(refDoc('agendamentos', ds.id), { status: 'Concluído' });
    const [servico, config] = await Promise.all([buscarDoc('servicos', ag.idServico), buscarDoc('fidelidadeConfig', estado.user.uid)]);
    const pontosGanhos = Math.round(Number(servico?.preco||0) * Number(config?.pontosPorReal||1));
    if (pontosGanhos > 0){
      await updateDoc(refDoc('usuarios', ag.idCliente), { pontosFidelidade: increment(pontosGanhos) });
      cacheUsuarios.delete(ag.idCliente);
      await addDoc(col('fidelidadeHistorico'), { idCliente: ag.idCliente, idProfissional: estado.user.uid, idAgendamento: ds.id, pontos: pontosGanhos, dataCriacao: serverTimestamp() });
    }
    toast(`Agendamento concluído${pontosGanhos ? ` · +${pontosGanhos} pontos para o cliente` : ''}!`, 'sucesso');
    viewAdminAgendamentos();
  },

  'abrir-servico-form': async (ds)=>{
    const editando = !!ds.id;
    const servico = editando ? await buscarDoc('servicos', ds.id) : null;
    if (estado.categorias.length === 0) estado.categorias = await listarTudo('categorias');
    const opcoesCat = estado.categorias.map(c=>`<option value="${c.id}" ${servico?.idCategoria===c.id?'selected':''}>${esc(c.nome)}</option>`).join('');
    abrirModal(`
      <h2>${editando?'Editar':'Novo'} serviço</h2>
      <form data-form="salvar-servico" data-id="${ds.id||''}">
        <div class="campo"><label>Nome</label><input name="nome" required value="${esc(servico?.nome||'')}"></div>
        <div class="campo"><label>Categoria</label><select name="idCategoria">${opcoesCat}</select></div>
        <div class="campo"><label>Ou nova categoria</label><input name="novaCategoria" placeholder="Deixe em branco se já escolheu acima"></div>
        <div class="campo"><label>Descrição</label><textarea name="descricao" rows="2">${esc(servico?.descricao||'')}</textarea></div>
        <div class="grade-2">
          <div class="campo"><label>Preço (R$)</label><input type="number" step="0.01" min="0" name="preco" required value="${servico?.preco??''}"></div>
          <div class="campo"><label>Duração (min)</label><input type="number" min="5" step="5" name="duracao" required value="${servico?.duracao??''}"></div>
        </div>
        <div class="campo"><label>Emoji ou URL de imagem (opcional)</label><input name="imagem" value="${esc(servico?.imagem||'')}" placeholder="✨ ou https://..."></div>
        <div class="linha-botoes"><button type="button" class="btn btn-secundario" id="btn-fechar-servico">Cancelar</button><button type="submit" class="btn btn-primario">Salvar</button></div>
      </form>`);
    $('#btn-fechar-servico').onclick = fecharModal;
  },
  'alternar-servico-ativo': async (ds)=>{ await updateDoc(refDoc('servicos', ds.id), { ativo: ds.ativo !== 'true' }); viewAdminServicos(); },
  'excluir-servico': async (ds)=>{ const ok = await confirmarAcao('Excluir este serviço? Essa ação não pode ser desfeita.'); if (!ok) return; await deleteDoc(refDoc('servicos', ds.id)); toast('Serviço excluído.', 'sucesso'); viewAdminServicos(); },

  'abrir-disponibilidade-form': (ds)=>{
    abrirModal(`
      <h2>Novo horário — ${DIAS_SEMANA_LABEL[ds.dia]}</h2>
      <form data-form="salvar-disponibilidade" data-dia="${ds.dia}">
        <div class="grade-2">
          <div class="campo"><label>Início</label><input type="time" name="horarioInicio" required></div>
          <div class="campo"><label>Fim</label><input type="time" name="horarioFim" required></div>
        </div>
        <div class="linha-botoes"><button type="button" class="btn btn-secundario" id="btn-fechar-disp">Cancelar</button><button type="submit" class="btn btn-primario">Salvar</button></div>
      </form>`);
    $('#btn-fechar-disp').onclick = fecharModal;
  },
  'alternar-disponibilidade-ativo': async (ds)=>{ await updateDoc(refDoc('disponibilidade', ds.id), { ativo: ds.ativo !== 'true' }); viewAdminDisponibilidade(); },
  'excluir-disponibilidade': async (ds)=>{ const ok = await confirmarAcao('Excluir este horário?'); if (!ok) return; await deleteDoc(refDoc('disponibilidade', ds.id)); toast('Horário excluído.', 'sucesso'); viewAdminDisponibilidade(); },

  'abrir-campanha-form': async (ds)=>{
    const editando = !!ds.id;
    const c = editando ? await buscarDoc('campanhas', ds.id) : null;
    abrirModal(`
      <h2>${editando?'Editar':'Nova'} campanha</h2>
      <form data-form="salvar-campanha" data-id="${ds.id||''}">
        <div class="campo"><label>Título</label><input name="titulo" required value="${esc(c?.titulo||'')}"></div>
        <div class="campo"><label>Descrição</label><textarea name="descricao" rows="2">${esc(c?.descricao||'')}</textarea></div>
        <div class="campo"><label>Status</label>
          <select name="status">
            <option value="agendada" ${c?.status==='agendada'?'selected':''}>Agendada</option>
            <option value="ativa" ${!c||c?.status==='ativa'?'selected':''}>Ativa</option>
            <option value="encerrada" ${c?.status==='encerrada'?'selected':''}>Encerrada</option>
          </select>
        </div>
        <div class="linha-botoes"><button type="button" class="btn btn-secundario" id="btn-fechar-camp">Cancelar</button><button type="submit" class="btn btn-primario">Salvar</button></div>
      </form>`);
    $('#btn-fechar-camp').onclick = fecharModal;
  },
  'somar-metrica-campanha': async (ds)=>{ await updateDoc(refDoc('campanhas', ds.id), { [ds.campo]: increment(ds.campo==='enviadas'?10:1) }); viewAdminCampanhas(); },
  'excluir-campanha': async (ds)=>{ const ok = await confirmarAcao('Excluir esta campanha?'); if (!ok) return; await deleteDoc(refDoc('campanhas', ds.id)); toast('Campanha excluída.', 'sucesso'); viewAdminCampanhas(); },

  'abrir-fidelidade-config': async ()=>{
    const config = await buscarDoc('fidelidadeConfig', estado.user.uid);
    abrirModal(`
      <h2>Configurar fidelidade</h2>
      <form data-form="salvar-fidelidade">
        <div class="campo"><label>Pontos por real gasto</label><input type="number" step="0.1" min="0" name="pontosPorReal" value="${config?.pontosPorReal??1}"></div>
        ${(config?.niveis||[]).map((n,i)=>`
          <div class="campo" style="border-top:1px solid var(--borda);padding-top:12px;">
            <label>${esc(n.nome)} (${n.pontosMin}–${n.pontosMax} pts) — benefício</label>
            <input name="beneficio-${i}" value="${esc(n.beneficio)}">
          </div>`).join('')}
        <div class="linha-botoes"><button type="button" class="btn btn-secundario" id="btn-fechar-fid">Cancelar</button><button type="submit" class="btn btn-primario">Salvar</button></div>
      </form>`);
    $('#btn-fechar-fid').onclick = fecharModal;
  },
};

// Escreve uma mensagem de erro/sucesso num container de formulário (#erro-login
// etc). Se a tela já mudou nesse meio-tempo (ex.: login bem-sucedido disparou
// onAuthStateChanged e trocou a rota antes deste código rodar) o elemento pode
// não existir mais no DOM — nesse caso mostra um toast em vez de travar com
// "Cannot set properties of null".
function mostrarMensagemForm(seletor, mensagem, classe){
  const el = $(seletor);
  if (el){ el.innerHTML = mensagem ? `<div class="${classe}">${mensagem}</div>` : ''; return; }
  if (mensagem) toast(mensagem.replace(/<[^>]*>/g,''), classe === 'sucesso-form' ? 'sucesso' : 'erro');
}

const formularios = {
  'login': async (form)=>{
    const tipo = form.dataset.tipo;
    const fd = new FormData(form);
    mostrarMensagemForm('#erro-login', '', 'erro-form');
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Entrando...';
    try{
      const cred = await signInWithEmailAndPassword(auth, fd.get('email').trim(), fd.get('senha'));
      const perfil = await buscarDoc('usuarios', cred.user.uid);
      if (!perfil || perfil.tipo !== tipo){
        await signOut(auth);
        mostrarMensagemForm('#erro-login', `Essa conta não é de ${tipo==='cliente'?'cliente':'profissional'}. Entre pela tela correta.`, 'erro-form');
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    }catch(err){
      mostrarMensagemForm('#erro-login', esc(erroFirebase(err)), 'erro-form');
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  },
  'cadastro': async (form)=>{
    const tipo = form.dataset.tipo;
    const fd = new FormData(form);
    mostrarMensagemForm('#erro-cadastro', '', 'erro-form');
    if (fd.get('senha') !== fd.get('confirmarSenha')){
      mostrarMensagemForm('#erro-cadastro', 'As senhas não coincidem.', 'erro-form');
      return;
    }
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Criando conta...';
    try{
      await fazerCadastro({
        tipo, nome: fd.get('nome').trim(), email: fd.get('email').trim(), senha: fd.get('senha'),
        telefone: fd.get('telefone')?.trim(), especialidade: fd.get('especialidade')?.trim(),
      });
      toast('Conta criada com sucesso!', 'sucesso');
    }catch(err){
      mostrarMensagemForm('#erro-cadastro', esc(erroFirebase(err)), 'erro-form');
      btn.disabled = false; btn.textContent = 'Criar conta';
    }
  },
  'recuperar-senha': async (form)=>{
    const fd = new FormData(form);
    try{
      await sendPasswordResetEmail(auth, fd.get('email').trim());
      mostrarMensagemForm('#erro-recuperar', 'Link enviado! Confira seu e-mail.', 'sucesso-form');
    }catch(err){
      mostrarMensagemForm('#erro-recuperar', esc(erroFirebase(err)), 'erro-form');
    }
  },
  'perfil-cliente': async (form)=>{
    const fd = new FormData(form);
    const dados = { nome: fd.get('nome').trim(), telefone: fd.get('telefone').trim()||null };
    await updateDoc(refDoc('usuarios', estado.user.uid), dados);
    Object.assign(estado.perfil, dados);
    cacheUsuarios.delete(estado.user.uid);
    toast('Perfil atualizado!', 'sucesso');
    aplicarRota();
  },
  'perfil-admin': async (form)=>{
    const fd = new FormData(form);
    const dados = { nome: fd.get('nome').trim(), especialidade: fd.get('especialidade').trim()||'Não informada', telefone: fd.get('telefone').trim()||null };
    await updateDoc(refDoc('usuarios', estado.user.uid), dados);
    Object.assign(estado.perfil, dados);
    cacheUsuarios.delete(estado.user.uid);
    toast('Perfil atualizado!', 'sucesso');
    aplicarRota();
  },
  'salvar-servico': async (form)=>{
    const fd = new FormData(form);
    let idCategoria = fd.get('idCategoria');
    const novaCategoria = fd.get('novaCategoria')?.trim();
    if (novaCategoria){
      const ref = await addDoc(col('categorias'), { nome: novaCategoria });
      idCategoria = ref.id;
      estado.categorias.push({ id: ref.id, nome: novaCategoria });
    }
    const dados = {
      idProfissional: estado.user.uid, idCategoria,
      nome: fd.get('nome').trim(), descricao: fd.get('descricao').trim()||null,
      preco: Number(fd.get('preco')), duracao: Number(fd.get('duracao')),
      imagem: fd.get('imagem').trim()||'', ativo: true,
    };
    if (form.dataset.id) await updateDoc(refDoc('servicos', form.dataset.id), dados);
    else await addDoc(col('servicos'), dados);
    fecharModal(); toast('Serviço salvo!', 'sucesso'); viewAdminServicos();
  },
  'salvar-disponibilidade': async (form)=>{
    const fd = new FormData(form);
    const ini = fd.get('horarioInicio'), fim = fd.get('horarioFim');
    if (horaParaMin(fim) <= horaParaMin(ini)){ toast('O horário de fim precisa ser depois do início.', 'erro'); return; }
    await addDoc(col('disponibilidade'), { idProfissional: estado.user.uid, diaSemana: form.dataset.dia, horarioInicio: ini, horarioFim: fim, ativo: true });
    fecharModal(); toast('Horário adicionado!', 'sucesso'); viewAdminDisponibilidade();
  },
  'enviar-mensagem': async (form)=>{
    const conversaId = form.dataset.conversa, outroUid = form.dataset.outro;
    const texto = form.texto.value.trim();
    if (!texto) return;
    form.texto.value = '';
    const meuUid = estado.user.uid;
    await addDoc(collection(db,'conversas',conversaId,'mensagens'), { remetente: meuUid, texto, criadoEm: serverTimestamp() });
    await updateDoc(refDoc('conversas', conversaId), {
      ultimaMensagem: texto, ultimaMensagemEm: serverTimestamp(),
      [`naoLidoPara.${outroUid}`]: true, [`naoLidoPara.${meuUid}`]: false,
    });
  },
  'salvar-campanha': async (form)=>{
    const fd = new FormData(form);
    const dados = { idProfissional: estado.user.uid, titulo: fd.get('titulo').trim(), descricao: fd.get('descricao').trim()||null, status: fd.get('status') };
    if (form.dataset.id) await updateDoc(refDoc('campanhas', form.dataset.id), dados);
    else await addDoc(col('campanhas'), { ...dados, enviadas: 0, abertas: 0, criadoEm: serverTimestamp() });
    fecharModal(); toast('Campanha salva!', 'sucesso'); viewAdminCampanhas();
  },
  'salvar-fidelidade': async (form)=>{
    const fd = new FormData(form);
    const config = await buscarDoc('fidelidadeConfig', estado.user.uid);
    const niveis = config.niveis.map((n,i)=>({ ...n, beneficio: fd.get(`beneficio-${i}`) }));
    await updateDoc(refDoc('fidelidadeConfig', estado.user.uid), { pontosPorReal: Number(fd.get('pontosPorReal')), niveis });
    fecharModal(); toast('Configuração salva!', 'sucesso'); viewAdminFidelidade();
  },
};

/* =====================================================================
   13) BOOTSTRAP — delegação de eventos global
===================================================================== */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = acoes[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  try{ await fn(el.dataset, el, e); }
  catch(err){ console.error(err); toast(erroFirebase(err), 'erro'); }
});
document.addEventListener('submit', async (e)=>{
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fn = formularios[form.dataset.form];
  if (!fn) return;
  try{ await fn(form); }
  catch(err){ console.error(err); toast(erroFirebase(err), 'erro'); }
});

</script>
